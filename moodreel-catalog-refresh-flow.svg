<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 1720' width='1600' height='1720' font-family='Inter, Helvetica, Arial, sans-serif'><rect width='1600' height='1720' fill='white'/><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#9ca3af'/></marker></defs><text x='40' y='48' font-size='24' font-weight='700' fill='#1f2937' text-anchor='start'>MoodReel MVP1 — catalog-refresh flow</text><text x='40' y='74' font-size='13' font-weight='400' fill='#6b7280' text-anchor='start'>Nightly Lambda that keeps movies, streaming availability, mood vectors and the per-country provider list fresh · idempotent, resumable, never on the request path</text><text x='1320.0' y='120' font-size='12' font-weight='700' fill='#6b7280' text-anchor='middle'>SERVICES TOUCHED</text><text x='800' y='120' font-size='12' font-weight='700' fill='#6b7280' text-anchor='middle'>CATALOG-REFRESH LAMBDA · 15 min timeout · ARM64</text><rect x='640.0' y='140' width='320' height='60' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800.0' y='167.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>1 · EventBridge cron fires 02:00 UTC</text><text x='800.0' y='186.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>invokes catalog-refresh</text><rect x='640.0' y='230' width='320' height='72' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800.0' y='263.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>2 · Read CATALOG_CURSOR</text><text x='800.0' y='282.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>runId · page · startedAt</text><polygon points='650.0,360 800,315.0 950.0,360 800,405.0' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800' y='356' font-size='13' font-weight='600' fill='#1f2937' text-anchor='middle'>3 · Run already started today?</text><text x='800' y='372' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>runId == today</text><rect x='330' y='430' width='240' height='60' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='450.0' y='457.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>Resume at saved page</text><text x='450.0' y='476.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>previous invocation ran out of time</text><rect x='930' y='430' width='240' height='60' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='1050.0' y='457.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>Start new run</text><text x='1050.0' y='476.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>runId = today · page = 1</text><rect x='640.0' y='540' width='320' height='72' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800.0' y='565.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>4 · Fetch TMDB page N</text><text x='800.0' y='584.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>popular titles + released in last 90 days</text><text x='800.0' y='600.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>20 titles per page</text><rect x='640.0' y='640' width='320' height='72' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800.0' y='673.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>5 · For each title: details + watch/providers</text><text x='800.0' y='692.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>one call per supported country (CA, ZA)</text><polygon points='640.0,770 800,722.0 960.0,770 800,818.0' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800' y='766' font-size='13' font-weight='600' fill='#1f2937' text-anchor='middle'>6 · New or changed since last run?</text><text x='800' y='782' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>updatedAt or provider hash differs</text><rect x='640.0' y='850' width='320' height='72' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800.0' y='875.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>7 · UpdateItem SET on Movies</text><text x='800.0' y='894.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>metadata · rating · availability.{CC}</text><text x='800.0' y='910.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>never PutItem, so the why cache survives</text><polygon points='640.0,985 800,937.0 960.0,985 800,1033.0' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800' y='981' font-size='13' font-weight='600' fill='#1f2937' text-anchor='middle'>8 · New title or synopsis changed?</text><text x='800' y='997' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>needs a fresh mood vector</text><rect x='640.0' y='1060' width='320' height='86' rx='10' fill='#e8f0fe' stroke='#2563eb' stroke-width='2.5'/><text x='800.0' y='1084.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>9 · Build the mood vector</text><text x='800.0' y='1103.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>Haiku writes moodDesc from synopsis + genres</text><text x='800.0' y='1119.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>Titan embeds it (1024-d) · upsert OpenSearch doc</text><text x='800.0' y='1135.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>SET moodDesc, embeddedAt</text><rect x='640.0' y='1180' width='320' height='60' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800.0' y='1207.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>10 · Copy poster to S3 if missing</text><text x='800.0' y='1226.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>w500/{tmdbId}.jpg</text><rect x='640.0' y='1270' width='320' height='60' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800.0' y='1297.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>11 · Save cursor: page = N + 1</text><text x='800.0' y='1316.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>Config · CATALOG_CURSOR</text><polygon points='640.0,1400 800,1352.0 960.0,1400 800,1448.0' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800' y='1396' font-size='13' font-weight='600' fill='#1f2937' text-anchor='middle'>12 · More pages and > 2 min left?</text><text x='800' y='1412' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>pages left · time remaining</text><rect x='640.0' y='1490' width='320' height='72' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800.0' y='1515.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>13 · Refresh Providers per country</text><text x='800.0' y='1534.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>watch/providers/movie?watch_region=CC</text><text x='800.0' y='1550.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>filtered to the curated allow-list</text><rect x='640.0' y='1600' width='320' height='72' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='800.0' y='1625.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>14 · Mark run complete</text><text x='800.0' y='1644.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>cursor.completedAt = now</text><text x='800.0' y='1660.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>emit CatalogRefreshCompleted · alarm if none in 26 h</text><rect x='1180' y='1364' width='280' height='72' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5' stroke-dasharray='6 5'/><text x='1320.0' y='1389.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>Re-invoke self (async)</text><text x='1320.0' y='1408.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>InvokeFunction, Event type</text><text x='1320.0' y='1424.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>next invocation resumes at step 2</text><rect x='1180' y='230' width='280' height='60' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='1320.0' y='257.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>DynamoDB · Config</text><text x='1320.0' y='276.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>CATALOG_CURSOR item</text><rect x='1180' y='560' width='280' height='130' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5' stroke-dasharray='6 5'/><text x='1320.0' y='598.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>TMDB API (external)</text><text x='1320.0' y='617.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>/movie/popular · /discover/movie</text><text x='1320.0' y='633.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>/movie/{id}?append_to_response=</text><text x='1320.0' y='649.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>  watch/providers,keywords</text><text x='1320.0' y='665.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>/watch/providers/movie?watch_region=CC</text><rect x='1180' y='856' width='280' height='60' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='1320.0' y='883.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>DynamoDB · Movies</text><text x='1320.0' y='902.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>one item per movie, maps for availability + why</text><rect x='1180' y='1053' width='280' height='100' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='1320.0' y='1084.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>Bedrock + OpenSearch Serverless</text><text x='1320.0' y='1103.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>Claude Haiku-class: moodDesc</text><text x='1320.0' y='1119.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>Titan Text Embeddings v2</text><text x='1320.0' y='1135.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>index movies-{cc}: vector + filters</text><rect x='1180' y='1180' width='280' height='60' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='1320.0' y='1207.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>S3 · moodreel-posters</text><text x='1320.0' y='1226.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>w500/{tmdbId}.jpg</text><rect x='1180' y='1270' width='280' height='60' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='1320.0' y='1297.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>DynamoDB · Config</text><text x='1320.0' y='1316.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>CATALOG_CURSOR item</text><rect x='1180' y='1496' width='280' height='60' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='1320.0' y='1523.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>DynamoDB · Providers</text><text x='1320.0' y='1542.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>one item per country</text><rect x='1180' y='1606' width='280' height='60' rx='10' fill='white' stroke='#9ca3af' stroke-width='1.5'/><text x='1320.0' y='1633.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>CloudWatch</text><text x='1320.0' y='1652.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>custom metric · 26 h alarm</text><rect x='140' y='560' width='300' height='130' rx='10' fill='#f3f4f6' stroke='#9ca3af' stroke-width='1.5'/><text x='290.0' y='598.0' font-size='14' font-weight='600' fill='#1f2937' text-anchor='middle'>TMDB errors (steps 4–5)</text><text x='290.0' y='617.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>429 or 5xx: exponential backoff</text><text x='290.0' y='633.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>1 s · 2 s · 4 s · 8 s · 16 s</text><text x='290.0' y='649.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>after 5 failures: persist cursor, exit,</text><text x='290.0' y='665.0' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>CatalogRefreshFailed alarm</text><path d='M800 200 V230' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M800 302 V315' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M650 360 H450 V430' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><text x='560' y='352' font-size='11.5' font-weight='500' fill='#15803d' text-anchor='middle'>yes</text><path d='M950 360 H1050 V430' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><text x='1040' y='352' font-size='11.5' font-weight='500' fill='#b45309' text-anchor='middle'>no</text><path d='M450 490 V515 H794' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M1050 490 V515 H806' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M800 515 V540' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M800 612 V640' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M800 712 V722' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M800 818 V850' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><text x='814' y='840' font-size='11.5' font-weight='500' fill='#15803d' text-anchor='start'>yes</text><path d='M800 922 V937' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M800 1033 V1060' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><text x='814' y='1052' font-size='11.5' font-weight='500' fill='#15803d' text-anchor='start'>yes</text><path d='M800 1146 V1180' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M800 1240 V1270' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M800 1330 V1352' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M800 1448 V1490' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><text x='814' y='1476' font-size='11.5' font-weight='500' fill='#b45309' text-anchor='start'>no · pages done</text><path d='M800 1562 V1600' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M640 770 H600 V1300 H640.0' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><text x='552' y='762' font-size='11.5' font-weight='500' fill='#b45309' text-anchor='end'>no · unchanged → 11</text><path d='M640 985 H620 V1210 H640.0' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><text x='552' y='977' font-size='11.5' font-weight='500' fill='#b45309' text-anchor='end'>no · keep vector → 10</text><path d='M640 1400 H560 V576 H640.0' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><text x='556' y='1392' font-size='11.5' font-weight='500' fill='#15803d' text-anchor='end'>yes · next page</text><path d='M960 1400 H1180' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><text x='1070' y='1392' font-size='11.5' font-weight='500' fill='#b45309' text-anchor='middle'>time low</text><path d='M1460 1400 H1520 V260 H1460' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)' stroke-dasharray='6 5'/><text x='1512' y='830' font-size='11.5' font-weight='500' fill='#6b7280' text-anchor='end'>resumes from the saved cursor</text><path d='M960.0 266 H1180' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M960.0 886 H1180' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M960.0 1210 H1180' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M960.0 1300 H1180' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M960.0 1532 H1180' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M960.0 1636 H1180' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M960.0 576 H1180' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M960.0 676 H1180' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><path d='M960.0 1103 H1180' fill='none' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arr)'/><rect x='140' y='1560' width='360' height='112' rx='8' fill='white' stroke='#e5e7eb'/><text x='160' y='1586' font-size='12' font-weight='700' fill='#6b7280' text-anchor='start'>Reading the flow</text><text x='160' y='1608' font-size='11.5' font-weight='600' fill='#15803d' text-anchor='start'>yes</text><text x='190' y='1608' font-size='11.5' font-weight='400' fill='#6b7280' text-anchor='start'>/</text><text x='200' y='1608' font-size='11.5' font-weight='600' fill='#b45309' text-anchor='start'>no</text><text x='222' y='1608' font-size='11.5' font-weight='400' fill='#6b7280' text-anchor='start'>branch labels on each decision</text><rect x='160' y='1620' width='22' height='14' rx='3' fill='#e8f0fe' stroke='#2563eb' stroke-width='2'/><text x='190' y='1632' font-size='11.5' font-weight='400' fill='#6b7280' text-anchor='start'>the only step that calls Bedrock (cost driver)</text><line x1='160' y1='1655' x2='182' y2='1655' stroke='#9ca3af' stroke-width='1.6' stroke-dasharray='6 5' marker-end='url(#arr)'/><text x='190' y='1659' font-size='11.5' font-weight='400' fill='#6b7280' text-anchor='start'>asynchronous · outside the current invocation</text></svg>